pretrained_model_path: "ckpt/stable-diffusion-v1-5"
logdir: ./result/person_across/multi_object_edit

dataset_config:
  path: "data/person_across/person_across"
  prompt: "A man walks from left to right and a woman walks from right to left on the road"
  n_sample_frame: 15
  start_sample_frame: 0
  sampling_rate: 2
  layout_mask_dir: "./data/person_across/layout_masks"
  layout_mask_order: ["man", "woman", "road", "background"]
  negative_promot: "ugly, blurry, low res, unrealistic, unaesthetic"

control_config:
  control_type: "dwpose"
  pretrained_controlnet_path: "ckpt/control_v11p_sd15_openpose"
  controlnet_conditioning_scale: 1.0
  hand: true
  face: true

editing_config:
  use_invertion_latents: true
  inject_step: 4
  old_qk: 1
  flatten_res: [1, 2]
  guidance_scale: 7.5
  use_pnp: false
  use_freeu: true
  editing_prompts:
    [
      [
        "Trump and Spiderman are walking on the road in the park",
        "Trump", "Spiderman", "the road", "the park",
      ],
    ]
  clip_length: "${..dataset_config.n_sample_frame}"
  sample_seeds: [0]
  num_inference_steps: 50
  blending_percentage: 0
  vis_cross_attn: true

test_pipeline_config:
  target: video_diffusion.pipelines.ddim_spatial_temporal.DDIMSpatioTemporalStableDiffusionPipeline
  num_inference_steps: "${..validation_sample_logger.num_inference_steps}"

seed: 42
