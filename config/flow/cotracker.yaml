pretrained_model_path: "ckpt/stable-diffusion-v1-5"
logdir: ./result/flow/cotracker

dataset_config:
  path: "data/02_walk_walk/02_walk_walk"
  prompt: "A man and a woman walking in opposite directions"
  n_sample_frame: 20
  start_sample_frame: 0
  sampling_rate: 3
  layout_mask_dir: "./data/02_walk_walk/layout_masks"
  layout_mask_order: ["moving_person", "standing_person"]
  negative_prompt: "ugly, blurry, low res, unrealistic, unaesthetic"

control_config:
  control_type: "dwpose"
  pretrained_controlnet_path: "ckpt/control_v11p_sd15_openpose"
  controlnet_conditioning_scale: 1.0
  hand: true
  face: false

editing_config:
  use_invertion_latents: true
  inject_step: 0
  old_qk: 1
  flatten_res: [1]
  guidance_scale: 7.5
  use_pnp: false
  use_freeu: true

  # CoTracker3 Configuration
  # Enable CoTracker3 for better occlusion handling
  use_cotracker: true
  # Use offline mode for best accuracy (recommended)
  # Set to true for online mode if memory is limited
  cotracker_online: false
  # Grid size for point sampling (auto-calculated if null)
  # Try values like 6, 8, 10 for different densities
  cotracker_grid_size: null
  # With dedicated GPU, we can use high quality mode
  cotracker_low_memory: false
  # Multi-GPU: Run CoTracker on a separate GPU (required to avoid OOM)
  # GPU 0: Main diffusion model
  # GPU 1: CoTracker trajectory tracking
  cotracker_gpu_id: 1

  editing_prompts:
    [
      [
        "Spiderman and Superman walking in opposite directions",
        "Spiderman", "Superman",
      ],
    ]
  clip_length: "${..dataset_config.n_sample_frame}"
  sample_seeds: [0]
  num_inference_steps: 50
  blending_percentage: 0
  vis_cross_attn: true

test_pipeline_config:
  target: video_diffusion.pipelines.ddim_spatial_temporal.DDIMSpatioTemporalStableDiffusionPipeline
  num_inference_steps: "${..validation_sample_logger.num_inference_steps}"

seed: 42
